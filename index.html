<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verdian Valley Quest</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game-card" aria-label="Verdian Valley Quest playable game">
        <div class="topbar">
          <div>
            <p class="eyebrow">Soft Skills RPG Prototype</p>
            <h1>Verdian Valley Quest</h1>
          </div>
          <div class="status-strip">
            <span id="timeBadge">20:00</span>
            <span id="stoneBadge">Stones 0/5</span>
            <span id="objectiveBadge">Begin</span>
          </div>
        </div>

        <div class="viewport-wrap">
          <canvas id="gameCanvas" width="960" height="640"></canvas>
          <div class="scene-stage" id="sceneStage" hidden></div>
          <div class="mobile-pad" aria-label="Mobile controls">
            <button type="button" data-move="up">▲</button>
            <button type="button" data-move="left">◀</button>
            <button type="button" data-action="interact">E</button>
            <button type="button" data-move="right">▶</button>
            <button type="button" data-move="down">▼</button>
          </div>
          <div class="dialog" id="dialog" hidden></div>
        </div>

        <div class="bottombar">
          <div class="meters" id="meters"></div>
          <div class="controls">
            <span>Move: WASD / Arrow keys</span>
            <span>Interact: E / Space</span>
            <button id="soundButton" type="button">Sound Off</button>
            <button id="restartButton" type="button">Restart</button>
          </div>
        </div>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
